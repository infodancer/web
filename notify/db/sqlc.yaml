version: "2"

sql:
  - engine: postgresql
    queries: queries.sql
    schema: ../migrations
    gen:
      go:
        package: db
        out: .
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_exact_table_names: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
