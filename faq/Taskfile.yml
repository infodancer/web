version: '3'

vars:
  COVERAGE_FILE: coverage.out
  BIN_DIR: bin

tasks:
  default:
    cmds:
      - task: check

  build:
    desc: Build the faq-serve CLI
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/faq-serve ./cmd/faq-serve

  install:
    desc: Install the faq-serve CLI to $GOPATH/bin
    cmds:
      - go install ./cmd/faq-serve

  serve:
    desc: Run faq-serve against a local Postgres for browser checks (see cmd/faq-serve/main.go for env vars)
    cmds:
      - go run ./cmd/faq-serve

  test:
    desc: Run tests with the race detector (DB tests skip without WEB_TEST_PG)
    cmds:
      - go test -race -count=1 ./...

  test:cover:
    desc: Run tests with coverage
    cmds:
      - go test -race -count=1 -coverprofile={{.COVERAGE_FILE}} ./...
      - go tool cover -func={{.COVERAGE_FILE}} | tail -1

  fmt:
    desc: Format code
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any file needs formatting
    cmds:
      - test -z "$(gofmt -l .)"

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vulncheck:
    desc: Run govulncheck
    cmds:
      - govulncheck ./...

  check:
    desc: All gating checks (fmt, vet, lint, test, vulncheck)
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test
      - task: vulncheck

  generate:
    desc: Regenerate store/ from queries.sql via the pinned sqlc version
    dir: store
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}} {{.COVERAGE_FILE}} coverage.html
