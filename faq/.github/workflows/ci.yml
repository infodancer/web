name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pin to a golangci-lint built with Go >= the go.mod directive:
          # the linter refuses to run when its build Go's language version
          # is older than the module's target (go 1.26.x here). v2.11.1 is
          # built with go1.26.1 and matches the .golangci.yml v2 schema.
          version: v2.11.1

  generate:
    name: sqlc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: sqlc vet
        working-directory: store
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 vet
      - name: Regenerate from queries.sql
        run: go generate ./...
      - name: Fail if generated code is stale
        run: git diff --exit-code

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
