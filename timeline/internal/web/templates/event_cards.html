{{define "content"}}{{range .Events}}
<div class="tl-event"
     data-date="{{.EventDate.Format "2006-01-02"}}"
     data-sort="{{.SortOrder}}"
     data-category-id="{{.CategoryID}}"
     data-slug="{{.Slug}}"
     title="{{formatDate .EventDate .DatePrecision}}">
    <span class="tl-event-title" data-inline-url="/t/{{$.TimelineSlug}}/event/{{.Slug}}/inline">{{.Title}}</span>
</div>
{{end}}{{end}}
