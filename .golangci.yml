# Single source of truth for the whole infodancer/web suite. golangci-lint is
# run per module in CI (each module builds against its own go.mod with
# GOWORK=off), and a root config is discovered by walking up from the module
# dir -- so this one file governs every module. Do not add per-module
# .golangci.yml files; tune here.
version: "2"

run:
  timeout: 5m
  # Lint integration-tagged files too, so issues there can't slip past CI. The
  # tag is harmless for modules without integration-tagged files.
  build-tags:
    - integration
  # The self-hosted CI runners pack several matrix lint jobs onto one host,
  # and golangci-lint's run-lock lives in a host-shared temp path (not the
  # per-job GOLANGCI_LINT_CACHE the CI workflow sets), so concurrent jobs
  # otherwise abort with "parallel golangci-lint is running". The workflow's
  # per-job cache already isolates analysis state, so letting the runs proceed
  # in parallel is safe. This is the fleet convention -- config-level, not a
  # workflow arg -- so it holds whichever workflow invokes the linter.
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      excludes:
        # G706 (log-injection taint): low severity (diagnostic-log fields are
        # already %q-escaped so control chars can't forge log lines) and its
        # taint pass is noisy and non-deterministic -- it surfaces a different
        # subset of call sites each run, which makes per-line nolint flaky.
        - G706
        # G705 (XSS taint): same non-deterministic SSA taint pass as G706 (it
        # fires on a different subset of writes each run, and not at all on some
        # linter versions). Every flagged sink writes xml.Marshal output -- all
        # element/attribute content is escaped -- served as application/xml with
        # X-Content-Type-Options: nosniff, so a browser can't render it as HTML.
        # gosec has no XML sanitizer in its model, so no honest code change
        # clears it; suppress the class here rather than scatter flaky nolints.
        - G705
        # G710 (open-redirect taint): the same SSA taint pass, and wrong about
        # every site it flags in faq (infodancer/web#102). An open redirect
        # needs control of the *start* of the URL -- a scheme, or a leading //
        # that makes it scheme-relative. Every flagged target is
        # fmt.Sprintf("%s/q/%d/%s", BasePath, id, slug.Normalize(title)) or a
        # sibling: the prefix is host configuration plus a string literal, and
        # the tainted parts are a suffix on an already-relative path. A suffix
        # cannot move the origin. The taint is also narrow on its own terms --
        # ids render as digits, and slug.Normalize emits only [a-z0-9-] and
        # cannot lead with a hyphen, so no /, :, or backslash survives it.
        # gosec models reachability from r to http.Redirect and stops there; it
        # has no notion of a relative path with a constant prefix, so no honest
        # code change clears it.
        - G710
    revive:
      rules:
        # unused-parameter is idiomatic noise: interface implementations and
        # http.HandlerFunc signatures legitimately carry parameters they don't
        # use. Disable suite-wide rather than rename dozens to _.
        - name: unused-parameter
          disabled: true
  # prealloc is intentionally not enabled: low-value micro-optimization.
  exclusions:
    rules:
      # bodyclose targets long-running production response-body leaks; in test
      # code the process is ephemeral, and test request helpers routinely hand
      # back an already-drained *http.Response that the analyzer flags anyway.
      # Keep bodyclose strict for production code; exempt tests.
      - linters:
          - bodyclose
        path: _test\.go

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
