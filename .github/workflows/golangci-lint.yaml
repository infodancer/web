name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: [self-hosted, linux, ci]
    env:
      GOWORK: "off"
    strategy:
      fail-fast: false
      matrix:
        module: [search, notify, blog, contact, newsletter, media, faq, timeline, integration, paging, sitemap, obs]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: ${{ matrix.module }}
          # The self-hosted ci runners share one host cache, so concurrent
          # matrix jobs collide on golangci-lint's lock ("parallel golangci-lint
          # is running"). This makes a job wait for the lock instead of failing.
          args: --allow-parallel-runners
