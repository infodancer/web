name: test

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, ci]
    # Each module builds against its own go.mod; the repo go.work is a
    # local-dev convenience only. DB-backed modules spin their own Postgres
    # via testcontainers, so no Actions service container is needed -- service
    # containers fail on the LXC-based self-hosted runners.
    env:
      GOWORK: "off"
    strategy:
      fail-fast: false
      matrix:
        module: [search, notify, blog, contact, newsletter, media, faq, timeline, profile, integration, paging, sitemap, obs, errnotice]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...
