name: govulncheck
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: [self-hosted, linux, ci]
    env:
      GOWORK: "off"
    strategy:
      fail-fast: false
      matrix:
        module: [search, notify, blog, contact, newsletter, media, faq, timeline, integration, paging, sitemap]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...
