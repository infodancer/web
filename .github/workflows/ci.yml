name: CI

# Thin caller for the shared Go CI (test + vet + fmt + lint + govulncheck),
# which lives in infodancer/workflows. Every job fans out over the module
# matrix below with GOWORK=off, so each module builds against its own go.mod
# and the repo's local go.work is ignored -- matching how the suite runs.
#
# go_version and govulncheck_go_version default to "stable": the suite tracks
# the current Go release, so stdlib advisories fixed in a newer patch resolve
# on the next run instead of pinning every module's go.mod. Dependency
# advisories still gate on reachability (the reusable govulncheck job fails
# only on a called symbol). run_tests is left on -- the shared test job already
# runs `go test -race -count=1 ./...` per module with the testcontainers Ryuk
# reaper disabled and a deterministic label-based reap, which is exactly what
# this suite needs (see infodancer/web#90).
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    # TEMPORARY: pinned to infodancer/workflows feat/test-postgres to prove
    # test_postgres_env in real CI before that change merges. Switch back to
    # @v0 once it is tagged, before this PR merges.
    uses: infodancer/workflows/.github/workflows/go-ci.yml@2ca7fea3ed93b7d1348c9f08eb46db1524f55c5d
    with:
      # Hand every test job a PostgreSQL to create databases on, so pgtest
      # suites run in CI instead of skipping (antibot, and pgtest itself).
      test_postgres_env: WEB_TEST_PG
      # media/cmd/media-import is a nested module under media/ that resolves
      # the parent through `replace ../..`. It was never in the matrix: #51
      # added it to go.work and the root Taskfile but not to the three
      # per-module workflows of the day, and #95 carried that gap forward when
      # it consolidated them. Nothing was checking it, so it drifted out of the
      # suite standard (go 1.26.5 against a parent requiring 1.26.6) and stopped
      # building entirely, which no run reported. Covered now.
      modules: >-
        ["search", "notify", "blog", "claim", "contact", "newsletter", "antibot", "media",
         "media/cmd/media-import", "faq", "timeline", "profile", "integration",
         "paging", "sitemap", "obs", "errnotice", "pgtest"]
      # Assert every tracked go.mod agrees on the go directive, and that
      # CONVENTIONS.md names that version. This repo is why the gate exists:
      # media/cmd/media-import stopped building for weeks on a one-patch
      # disagreement with its parent (#111), and CONVENTIONS.md drifted from the
      # code three times (#86, then twice more). The check scans every tracked
      # go.mod rather than the matrix above, which is the point -- the module
      # that broke was the one the matrix did not cover.
      check_go_consistency: true
      go_version_doc: CONVENTIONS.md
